<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>printing</title>
</head>

<body>

    <script>
        document.write("Hellow JS Code");  //me text ak line me aa jata
        document.write("Hello coders");//me text ak line me aayega but ak space aa jayega
        
        document.writeln("Hello")
        document.writeln("Hello")

        //console is not for users , its is for developer

        console.log("THis is console log.");
        console.info("This is use for show info");
        console.warn("This is warning");
        console.error("This is error");

        // dialog box for users
        alert("This is Alert");

        //confirm page ke liye hota hai

        let c = confirm("Do you want to exit")
        console.log(c);

        //ak input box khulega jisme hm text likh kr console me print kara skate hain

        let name = prompt("Enter your name")
        console.log(name);
    </script>

</body>

</html>
