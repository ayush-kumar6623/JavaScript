<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #a{
            height: 300px;
            width: 200px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="a"></div>

    <button type="button" onclick="add()">Add class</button>
    <button type="button" onclick="remove()">Removeclass</button>
    <button type="button" onclick="toggle()">toggle class</button>

    <script>
        let a =document.getElementById("a")
        console.log(a);
        console.log(a.classList.contains("a"));
        function add(){
            a.classList.add("a")
            console.log(a.classList.contains("a"));
            
        }
        function remove(){
            a.classList.remove("a")
        }
        function toggle(){
            a.classList.toggle("a")
        }
        
        
    </script>
</body>
</html>
