<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <script>
        let promise = new Promise( (resolve, reject)=>{

            let success = true;

            if (success) {
                resolve("Task Successfully Complete");
            } else {
                reject("Task Failed");
            }

        });

        promise.then((Text)=>console.log(Text)).catch((err)=>console.log(err))

    </script>
