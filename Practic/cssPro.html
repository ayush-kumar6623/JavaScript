<head>

    <title>Document</title>
</head>

<body>

    <h1 id="h1">This is heading 1</h1>
    <h1 id="h2">This is heading 2</h1>
    <h1 id="h3">This is heading 3</h1>

    <script>

            let heading1=document.getElementById("h1")

            heading1.style.height="90px"
            heading1.style.textAlign="center"
            heading1.style.color="blue"
            
            let heading2=document.getElementById("h2")

            h2.style.color="yellow"
            h2.style.fontSize="50px"
            h2.style.height="90px"
            h2.style.textAlign="center"
    
            
            let heading3=document.getElementById("h3")
            h3.style.backgroundColor="red"
            h3.style.color="yellow"
            h3.style.fontSize="50px"
            h3.style.height="90px"
            h3.style.textAlign="center"
    

    </script>
