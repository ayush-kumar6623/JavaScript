<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>
    let b=["Ayush","ashu"]
    console.log(b.length);  //size ko btata hai
    b.push("Amit","ram")//push- last me data add krna
    console.log(b);
    
    b.pop()//pop- last se data remove krna jisme koi data nhi likhna hota
    console.log(b);
    
    b.unshift("Ram")//unshift- starting me value ko add krta hai
    console.log(b);
    
    b.shift()//shift- starting se value ko remove krta hai.
    console.log(b);
    
    
</script>

</body>
</html>
