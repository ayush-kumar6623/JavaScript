<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        console.log("For Loop");
        for(let i=1; i<=10; i++) {
            //statement
            console.log(i);
        }

        console.log("While Loop");

        let j =1;
        while (j <= 10) {
            console.log(j);
            j++
        }

        console.log("Do While");

        let x = 1;

        do{
            console.log(x);
            x++
        } while (x <= 10)

        let arr = ["HTML", "CSS", "JS", "PHP"]
        console.log(arr);

        for(item of arr) {
            console.log(item);
        }

        let obj = {
            name: "Ayush",
            email: "ayush@gmail.com",
            age:"22"
        }
        console.log("------------------------------------------------------------");

        for(key in obj) {
            console.log(key, obj[key]);
        }

    </script>

</body>
</html>
