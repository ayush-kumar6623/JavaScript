<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body{
            background-color: rgb(219, 186, 192);
            font-family: "Roboto", sans-serif;
        }
        #main{
            height: 400px;
            width: 600px;
            border: none;
            box-shadow: 2px 2px 10px rgb(189, 154, 154);
            margin: 100px auto;
            background-color: white;
            border-radius: 10px;
            /* display: flex; */
            padding: 20px 40px;
        }
        h3{
            color: rgb(107, 105, 105);
        }
        input{
            height: 30px;
            width: 86%;
            border-radius: 4px;
            border: 1px solid rgb(156, 144, 144);
            padding-left: 5px;
        }
        button{
            height: 35px;
            width: 10%;
            font-weight: bold;
            background-color: rgb(94, 94, 235);
            color: white;
            border: none;
            border-radius: 4px;
            box-shadow: 2px 2px 8px rgb(173, 169, 169);
        }
        #listItems{
            margin-top: 20px;
        }
        
    </style>
</head>
<body>
    <div id="main">
        <h3>Awesome Todo List</h3>
        <input type="text" placeholder="What do you need to do today?"/>
        <button>ADD</button>

        <div id="listItems">
            <input type="checkbox">
            <input type="checkbox">
            <input type="checkbox">
            <input type="checkbox">
            <input type="checkbox">
            <input type="checkbox">

        </div>

    </div>
</body>
</html>
