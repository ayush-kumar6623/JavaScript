<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>

    <style>
        .card {
            width: 220px;
            min-height: 280px;
            border: 2px solid black;
            display: inline-block;
            margin: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 2px 4px 8px gray;
            transition: 0.3s;
            vertical-align: top;
            background-color: white;
        }

        .card:hover {
            box-shadow: 4px 12px 20px red;
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .card h3  {
            padding-left:20px;
        }
        

    </style>
</head>

<body>

    <div id="products"></div>

    <script src="card.js"></script>

</body>
</html>
