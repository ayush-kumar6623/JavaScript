<script>
    let opt=Number(prompt("Enter a options(1,2,3,4)"))

    switch(opt)
    {
        case 1:
            alert("YOu selected option 1 ")
            break;
        case 2:
            alert("You selected Option 2")
        default:
            alert("You Selected an invalid option")
    }
</script>
