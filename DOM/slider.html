<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #slider{
            height:200px;
            width:600px;
            background-color: black;
            margin:30px;
            overflow:hidden

        }
        #track{
            display:flex;
            gap:15px;
            height:630px;

        }
        #track img{
            width:200px;
            height:200px;
            object-fit: cover;
            flex-shrink: 0;
        }
        button{
            background-color: blue;
            color: white;
            font-size: 40px;
            
        }
    </style>
</head>
<body>
    <div id="slider">
        <div id="track"></div>
    </div>
    <button onclick="prev()">Prev </button>
    <button onclick="next()">Next </button>
    <script>
        let track=document.getElementById('track')
        let images=[
            '2.webp',
            'img1.jpg',
            'img2.jpg',
            '2.webp',
            'img1.jpg',
            'img2.jpg',
            '2.webp',
            'img1.jpg',
            'img2.jpg',
            '2.webp',
            'img1.jpg',
            'img2.jpg'
            
        ]
        
        for(i=0;i<images.length;i++){
            let img=document.createElement('img')
            img.src=images[i];
            track.appendChild(img)
        }

        let start=0;

        function next(){
            if(start<images.length-3){
                start++;
                track.style.transform=
                `tarnslateX(-${start*215}px)`;
            }
        }
        function prev(){
            if(start>images.length-3){
                start--;
                track.style.transform=
                `tarnslateX(-${start*215}px)`;
            }
        }
    </script>
</body>
</html>
